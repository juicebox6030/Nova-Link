; NOVA-LINK device configuration
; ==============================
;
; Loaded with nl_config_load() (include/nova_link/nl_config_file.h). Every
; key below is set to its built-in default, so this file loads to exactly
; the same configuration as an empty file. Delete the lines you do not
; change, or keep them as documentation.
;
; Syntax
;   ; or # at the start of a line is a comment. Inside a value, ; or # start
;   a comment only after whitespace. Values may be "quoted" to keep ; # and
;   leading/trailing spaces. Section and key names are case-sensitive.
;   Unknown sections or keys, and setting the same key twice, are errors.
;
; Integers
;   Decimal or 0x hex, no sign.
;
; Times (keys ending in _us)
;   A plain integer is microseconds:          dwell_us = 2000
;   A unit suffix (us, ms, s) is also fine:   dwell_us = 2ms
;   Fractions are fine if the result is a whole number of microseconds:
;                                             dwell_us = 1.5ms
;   The same key without _us is an alias that REQUIRES a unit:
;                                             dwell = 2ms
;   (dwell = 2000 is an error: the unit would be ambiguous.)
;   Maximum 2147483647 us (about 35.8 minutes); 0 usually means "off".
;
; Frequencies ([zone.N])
;   subghz_hz / ghz24_hz take an integer in Hz; subghz_mhz / ghz24_mhz take
;   MHz with decimals (903.5). Use one spelling per zone and band.
;   Sub-GHz: 300 .. 1000 MHz. 2.4 GHz: 2400 .. 2483.5 MHz.
;   0 means the zone has no frequency on that band.
;
; Booleans
;   true/false, yes/no, on/off, 1/0.

[device]
; This device's originID on air, 0..7. Every device in range needs its own.
origin_id = 0
; Name sent in device announcements, 1..24 bytes.
name = nova-link

[radio]
; RF band: subghz, 2g4 (2.4 GHz), or dual (transmit on both, listen
; alternately).
band = subghz
; immediate: transmit as soon as the current action ends.
; in_slot:   transmit only during the zone's own rotation slot.
tx_policy = immediate
; Transmissions per fragment, 1..255.
tx_repeats = 3
; Listen time per rotation slot.
dwell_us = 2ms
; Extra dwell after hearing a BURST fragment.
burst_extend_us = 4ms
; Zone 0 stays in rotation this long after hearing MGMT_LISTEN.
mgmt_hold_us = 250ms
; Minimum gap between repeats of one fragment.
repeat_interval_us = 1500us
; Radio dedup entry expiry (recovers from a sender reboot).
tracker_stale_us = 500ms
; Random 0..N extra delay added to each repeat gap.
repeat_jitter_us = 1ms
; Listen on zone 0 at least this often even without MGMT_LISTEN, so silent
; devices discover each other (0 = only when pulled in by MGMT_LISTEN).
discovery_interval_us = 20ms
; Transmissions per zone 0 (management) fragment, 0..255 (0 = tx_repeats).
; Devices only visit zone 0 briefly, so management needs more repeats than
; data to be heard reliably; it is low-rate, so the airtime cost is small.
mgmt_repeats = 6
; Listen before talk: before each transmission the radio checks that the
; channel is clear and, if not, retries after a random 1..N. After hearing a
; packet it also waits a random 0..N before transmitting, so devices that
; waited for the same packet do not all start at once. 0 = transmit blindly.
cca_backoff_us = 2ms

[host]
; Device + claim announcement period (0 = only on change).
announce_interval_us = 2s
; Each announcement period is shortened by a random 0..N. Answers to a
; device that does not know us yet (a new peer, or a peer list without our
; origin) are delayed by a random 0..N, at most mgmt_hold_us / 2.
announce_jitter_us = 250ms
; The first announcement after start is delayed by a random 0..N, so devices
; powered up together do not all announce at once (0 = immediately).
announce_boot_spread_us = 100ms
; The first N announcement periods after start are shortened to
; interval/2^N, ..., interval/2, giving a new device several early chances
; to be heard (0..16, 0 = off).
announce_ramp_steps = 3
; Jitter PRNG seed; 0 = derive from origin_id and name. Prefer hardware
; entropy set in code.
rand_seed = 0
; Minimum gap between Zone 0 (metadata) fragments.
meta_interval_us = 10ms
; Delay before the first Zone 0 fragment of a batch.
meta_lead_us = 10ms
; Keep setting MGMT_LISTEN this long after the last Zone 0 fragment.
mgmt_flag_hold_us = 50ms
; Radio status poll period (0 = off).
status_interval_us = 1s
; Forget remote zone claims after this.
remote_claim_expiry_us = 10s
; Forget remote devices after this.
peer_expiry_us = 10s
; Host-side dedup stream expiry.
tracker_stale_us = 500ms
; Drop fragments whose sender announced a different plugin type for the zone.
check_remote_types = true
; Most fragments pulled from the radio per poll, 1..255
; (default NL_RADIO_RXQ_DEPTH, 16 unless overridden at build time).
max_pull_per_poll = 16

; Zones 0..7. priority is the rotation weight: 0 = not in rotation, 1..8 =
; slots per round (the radio caps at 8). Zones 1..7 only rotate while a local
; plugin claims them, then with at least priority 1. Zone 0 is the metadata
; zone; priority 0 means it joins only while MGMT_LISTEN is heard or for
; discovery visits.
; Default frequencies: sub-GHz 903 + 3*N MHz, 2.4 GHz 2405 + 10*N MHz.

[zone.0]
priority = 0
subghz_mhz = 903
ghz24_mhz = 2405

[zone.1]
priority = 0
subghz_mhz = 906
ghz24_mhz = 2415

[zone.2]
priority = 0
subghz_mhz = 909
ghz24_mhz = 2425

[zone.3]
priority = 0
subghz_mhz = 912
ghz24_mhz = 2435

[zone.4]
priority = 0
subghz_mhz = 915
ghz24_mhz = 2445

[zone.5]
priority = 0
subghz_mhz = 918
ghz24_mhz = 2455

[zone.6]
priority = 0
subghz_mhz = 921
ghz24_mhz = 2465

[zone.7]
priority = 0
subghz_mhz = 924
ghz24_mhz = 2475
