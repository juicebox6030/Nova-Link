name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: C core (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc
            cc: gcc
            build_type: Release
            sanitizers: OFF
          - name: clang
            cc: clang
            build_type: Release
            sanitizers: OFF
          - name: gcc sanitizers
            cc: gcc
            build_type: Debug
            sanitizers: ON
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DNOVA_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
          -DNOVA_BUILD_EXTENDED=OFF
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test SDK, plugin conformance, fault backends and offline tools
        run: ctest --test-dir build --output-on-failure --parallel 2
      - name: Check installed SDK, developer support and common plugin manifests
        run: |
          cmake --install build --prefix "$PWD/build/sdk"
          cmake -S tests/consumer -B build/consumer -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_PREFIX_PATH="$PWD/build/sdk"
          cmake --build build/consumer
          ./build/consumer/consumer
      - name: Check source formatting
        run: git diff --check HEAD^ HEAD

  prototype:
    name: Standalone extended prototype
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test independently with UBSan traps
        run: |
          cmake -S experimental/extended -B build/extended -DCMAKE_BUILD_TYPE=Debug -DNL_UBSAN=ON
          cmake --build build/extended --parallel 2
          ctest --test-dir build/extended --output-on-failure --parallel 2

  python:
    name: Python ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.version }}
      - name: Capture analyzer
        run: python3 -m unittest discover -s tests -p test_rf_capture.py
      - name: Plugin starter and conformance generator
        run: python3 tests/test_plugin_scaffold.py
      - name: Extended codecs and CLI
        working-directory: experimental/extended
        run: python3 -m unittest discover -s tools/tests -t tools

  docs:
    name: Doxygen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen
      - name: Generate both API references with warnings as errors
        run: |
          cmake -S . -B build -DNOVA_BUILD_TESTS=OFF -DNOVA_BUILD_TOOLS=OFF
          cmake --build build --target docs docs-extended
