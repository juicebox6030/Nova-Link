<text x="633" y="405" font-family="Arial,sans-serif" font-size="12" fill="#283849">13 index holes / 15 degree spacing</text>
<text x="633" y="430" font-family="Arial,sans-serif" font-size="12" fill="#283849">R29; diameter 3.20 +0.05/0</text>
<text x="633" y="455" font-family="Arial,sans-serif" font-size="12" fill="#283849">Pin diameter 3.00 -0.02/0</text>
<text x="633" y="480" font-family="Arial,sans-serif" font-size="12" fill="#283849">Pull 4.2 mm to release; spring return</text>
<text x="40" y="525" font-family="Arial,sans-serif" font-size="12" fill="#283849">Independent R30 stop slot: width4.30; rounded R2.15 ends; diameter4 peg through diameter4.10 cheek bore.</text>
<text x="40" y="550" font-family="Arial,sans-serif" font-size="12" fill="#283849">Nominal stop travel180.57 degrees; acceptance180 +/-1. Lock release cannot bypass stop.</text>
<text x="40" y="575" font-family="Arial,sans-serif" font-size="12" fill="#283849">Lock guide B19: OD3.80 / ID3.20 x9; x58..67; divider/covers seal to sleeve; attachment still open.</text>
<text x="40" y="600" font-family="Arial,sans-serif" font-size="12" fill="#283849">USB window x65.5..78; wire-lane edge x64.8; board and receptacle lowered1 mm to clear guide.</text>
<text x="40" y="625" font-family="Arial,sans-serif" font-size="12" fill="#283849">Target: lock1 N m, stop2 N m, axial100 N, cable40 N. Retainers/endcaps/slider and qualification open.</text>
<text x="30" y="676" font-family="Arial,sans-serif" font-size="10" fill="#283849">Supplier components shown as envelopes. Verify actual footprints, latch approach, harness and fixture CAD before tooling.</text>
<text x="30" y="694" font-family="Arial,sans-serif" font-size="10" fill="#283849">See canonical design for tolerances, assembly requirements, release gates and primary-source links.</text>
