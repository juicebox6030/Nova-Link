<text x="45" y="395" font-family="Arial,sans-serif" font-size="13" fill="#283849">PACKING / x-y coordinates and full critical stack in canonical design</text>
<text x="45" y="425" font-family="Arial,sans-serif" font-size="12" fill="#283849">U5 max: 12.93 x 10.63 x 3.55; TI RGZ nominal: 7 x 7; SPI NOR DFN max: 5.10 x 6.10 x 0.60.</text>
<text x="45" y="450" font-family="Arial,sans-serif" font-size="12" fill="#283849">Cap max: diameter 13.5 x 28.4; PCB gap1.0 / lid gap1.5 nominal; cradle detailed design open.</text>
<text x="45" y="475" font-family="Arial,sans-serif" font-size="12" fill="#283849">USB: 11.4 x 8.35 x 3.66 envelope; footprint width reserve 12.3; shell aperture 14 x 6.</text>
<text x="45" y="500" font-family="Arial,sans-serif" font-size="12" fill="#283849">Cavity minimum width 29.5 minus PCB maximum 28.1 = 1.4 total lateral clearance.</text>
<text x="45" y="525" font-family="Arial,sans-serif" font-size="12" fill="#283849">Latch: retain 18 mm approach envelope; test finger action with power and DMX cables fitted.</text>
<text x="45" y="550" font-family="Arial,sans-serif" font-size="12" fill="#283849">Antenna keepout x78..96: no screws, capacitor or ground copper. External metal gap requires RF validation.</text>
<text x="45" y="575" font-family="Arial,sans-serif" font-size="12" fill="#283849">98 mm retained: 25 x 6 power reservation does NOT prove complete EDA placement; routing/cradle remain open.</text>
<text x="30" y="676" font-family="Arial,sans-serif" font-size="10" fill="#283849">Supplier components shown as envelopes. Verify actual footprints, latch approach, harness and fixture CAD before tooling.</text>
<text x="30" y="694" font-family="Arial,sans-serif" font-size="10" fill="#283849">See canonical design for tolerances, assembly requirements, release gates and primary-source links.</text>
