<text x="70" y="918" font-family="Arial,sans-serif" font-size="10" fill="#263746">External clamp / shaped flex tongue; screws outside routed board</text>
<text x="610" y="455" font-family="Arial,sans-serif" font-size="10" fill="#263746">Proper rotation: local +Z -&gt; global +Y; local +Y -&gt; global -Z.</text>
<text x="610" y="479" font-family="Arial,sans-serif" font-size="10" fill="#263746">Global=(75+x, 26.1+z, 10-y); determinant +1.</text>
<text x="610" y="503" font-family="Arial,sans-serif" font-size="10" fill="#263746">PCB X75..102 / Y25.1..26.1 / Z-10..10.</text>
<text x="610" y="527" font-family="Arial,sans-serif" font-size="10" fill="#263746">98 actual holes and four swept stake allocations retained.</text>
<text x="610" y="551" font-family="Arial,sans-serif" font-size="10" fill="#263746">Edge capture0.20; copper gap &gt;=0.3005 from actual saved copper.</text>
<text x="610" y="575" font-family="Arial,sans-serif" font-size="10" fill="#263746">No new PCB holes. End retainer uses two external M1 screws.</text>
<text x="610" y="599" font-family="Arial,sans-serif" font-size="10" fill="#263746">Board1.0 +/-0.1; top lip clearance0.24 nominal.</text>
<text x="610" y="623" font-family="Arial,sans-serif" font-size="10" fill="#263746">Bottom reserve -1.35; top reserve +3.71 from PCB top.</text>
<text x="610" y="647" font-family="Arial,sans-serif" font-size="10" fill="#263746">R2.5 formed static bend; saddle ends before PCB edge.</text>
<text x="610" y="671" font-family="Arial,sans-serif" font-size="10" fill="#263746">Clamp shoe0.94 high; two M1 screws, preload unqualified.</text>
<text x="610" y="695" font-family="Arial,sans-serif" font-size="10" fill="#263746">Solder access slot20.8 x2.8; enclosure sealing/guard gate.</text>
<text x="610" y="719" font-family="Arial,sans-serif" font-size="10" fill="#263746">No insulating pad over ICs; no rated heat path asserted.</text>
<text x="610" y="743" font-family="Arial,sans-serif" font-size="10" fill="#263746">Four inherited GCT NPTH process errors remain unresolved.</text>
<text x="30" y="970" font-family="Arial,sans-serif" font-size="10" fill="#263746">Static flex, solder, spring, wear, thermal/current, source faults, USB profile and mains safety remain qualification gates.</text>
