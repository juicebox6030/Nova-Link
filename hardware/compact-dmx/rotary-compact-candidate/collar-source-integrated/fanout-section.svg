<text x="450" y="840" font-family="Arial,sans-serif" font-size="11" fill="#263746">Clamp contacts the full-width covered flex, outside solder lands.</text>
<text x="450" y="865" font-family="Arial,sans-serif" font-size="11" fill="#263746">Preload, solder wetting, peel strength and flex profile unqualified.</text>
<text x="450" y="890" font-family="Arial,sans-serif" font-size="11" fill="#263746">Incremental hot loop 14.20 mOhm / 42.4 mV at2.987A.</text>
<text x="450" y="915" font-family="Arial,sans-serif" font-size="11" fill="#263746">Source power budget must include this static extension.</text>
