<text x="45" y="680" font-family="Arial,sans-serif" font-size="11" fill="#263746">Core R24 / shell ID32 / OD33; projection scale7.5 units/mm. RouteR31.6; bendR2.5.</text>
<text x="45" y="706" font-family="Arial,sans-serif" font-size="11" fill="#263746">Axial trim center shifts X57 -&gt;85.5; width20. All ruling lines remain parallel to X.</text>
<text x="650" y="160" font-family="Arial,sans-serif" font-size="13" fill="#263746">STATIC DEVELOPED PATTERN</text>
<text x="650" y="193" font-family="Arial,sans-serif" font-size="10" fill="#263746">Centerline 183.690 mm; active1046.168 unchanged.</text>
<text x="650" y="225" font-family="Arial,sans-serif" font-size="10" fill="#263746">Single-layer RA70um / total0.16 proposed stack.</text>
<text x="650" y="249" font-family="Arial,sans-serif" font-size="10" fill="#263746">Two8mm traces /1mm gap; Minco material-class basis.</text>
<text x="650" y="273" font-family="Arial,sans-serif" font-size="10" fill="#263746">No plated features in active bend; static pad coverlay window.</text>
<text x="650" y="297" font-family="Arial,sans-serif" font-size="10" fill="#263746">J0.1 /FPC_5V: local(6,18.4), globalX81.</text>
<text x="650" y="321" font-family="Arial,sans-serif" font-size="10" fill="#263746">J0.2 /GND_ISO: local(15,18.4), globalX90.</text>
<text x="650" y="345" font-family="Arial,sans-serif" font-size="10" fill="#263746">Pads8 x2, cornerR0.2; unchanged actual KiCad lands.</text>
<text x="650" y="369" font-family="Arial,sans-serif" font-size="10" fill="#263746">Exposed flex conductor ends overlap Z-9.4..-7.4.</text>
<text x="650" y="393" font-family="Arial,sans-serif" font-size="10" fill="#263746">J0 saved0.3mm land/joint allocation retained.</text>
<text x="650" y="417" font-family="Arial,sans-serif" font-size="10" fill="#263746">Joint thickness/fillet/process are engineering gates.</text>
<text x="650" y="441" font-family="Arial,sans-serif" font-size="10" fill="#263746">No conductive solder bridge across1mm trace gap.</text>
<text x="650" y="465" font-family="Arial,sans-serif" font-size="10" fill="#263746">Clamp Z-14..-12; shoe Y26.56..27.5.</text>
<text x="650" y="489" font-family="Arial,sans-serif" font-size="10" fill="#263746">Saddle stops atZ-10.3, before boardedgeZ-10.</text>
<text x="650" y="513" font-family="Arial,sans-serif" font-size="10" fill="#263746">Bottom/top flex Y26.4/26.56 at termination.</text>
<text x="650" y="537" font-family="Arial,sans-serif" font-size="10" fill="#263746">Bare-copper orientation and polarity require assembly check.</text>
<text x="30" y="760" font-family="Arial,sans-serif" font-size="13" fill="#263746">TERMINAL STRAIGHT SECTION / horizontal32 and vertical55 drawing units per mm</text>
