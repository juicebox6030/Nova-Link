<text x="545" y="539" font-size="12" font-family="Helvetica, sans-serif" fill="#172c3e">Base z5..7; external case 98 x 34 x 24</text>
<text x="60" y="580" font-size="12" font-family="Helvetica, sans-serif" fill="#172c3e">Y increases right; Z increases up. Section at connector centre X42.7.</text>
<text x="60" y="600" font-size="12" font-family="Helvetica, sans-serif" fill="#172c3e">Stakes and support rails lie out of this section; see PCB view and editable solids.</text>
<text x="35" y="641" font-size="12" font-family="Helvetica, sans-serif" fill="#172c3e">PLAN: main board x4..94 / y23..51. Tongue x36.5..48.9 / y51..53.3 (12.4 x 2.3).</text>
<text x="35" y="664" font-size="12" font-family="Helvetica, sans-serif" fill="#172c3e">USB origin (42.7,47.6); stakes x38.38/47.02 at y47.6/51.4; plated slots 0.6 x 1.2.</text>
<text x="35" y="687" font-size="12" font-family="Helvetica, sans-serif" fill="#172c3e">Rails: x36.9..37.4 and 48.0..48.5, y49..52.7; z7..9.6 + 0.4 foam. Stake screening bottom z9.75.</text>
<text x="35" y="710" font-size="12" font-family="Helvetica, sans-serif" fill="#172c3e">Bridge, rear stop and shell are projected envelopes; compliant rear pad omitted for clarity. No supplier internal model.</text>
<text x="35" y="745" font-size="12" font-family="Helvetica, sans-serif" fill="#172c3e">Gates: stake thickness, shim/pad compression, insertion-load/creep strength, exact plug and process tolerances.</text>
<text x="35" y="768" font-size="12" font-family="Helvetica, sans-serif" fill="#172c3e">Local prototype only; no routed-PCB, RF, power-placement, assembly-fit or manufacturing-release acceptance.</text>
